name: Auto Merge

# Evaluates merge-pool eligibility, verifies required status checks, and
# merges directly via the REST API using the bot token. Bypasses GitHub's
# native auto-merge (enablePullRequestAutoMerge) which has a known bug
# where mergeStateStatus reports BLOCKED even when all required checks pass.
#
# Publishes a "Merge Gate" commit status for visibility in the PR merge box.
#
# Also accepts workflow_dispatch (from review sync / OWNERS /lgtm bot APPROVE)
# so Merge Gate retries after an approving review even when lgtm/approved
# labels were already present (no labeled event).
on:
  pull_request_target:
    types: [opened, labeled, unlabeled, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate
        required: true
        type: string
      pr_head_sha:
        description: PR head SHA for Merge Gate commit status
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  statuses: write
  checks: read
  actions: read

jobs:
  evaluate:
    name: Evaluate Merge Eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: auto-merge-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate bot token
        id: bot-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-administration: read

      - name: Setup scripts
        uses: ./.github/actions/setup-gh-scripts
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Evaluate eligibility and merge if ready
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.pr_head_sha }}
        working-directory: .github/scripts
        run: npx tsx src/merge/auto-merge.ts
