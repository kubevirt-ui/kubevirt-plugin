name: PR Label Sync

# Consolidated from verify-merge-pool-labels.yml + retest-on-pool-entry.yml.
#
# 1. verify: strips unauthorized lgtm/approved/do-not-merge/hold label
#    additions (same thin-gate trust enforcement as verify-review-labels).
# 2. retest-if-eligible: dispatches a fresh E2E if the PR just became
#    merge-pool eligible while its gating check is stale.
#
# Sequential ordering (needs: verify) is intentional: verify label
# legitimacy *before* acting on the resulting pool state.
on:
  pull_request_target:
    types: [labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  actions: write

jobs:
  verify:
    name: Verify Merge Pool Labels
    if: >-
      (github.event.action == 'labeled' &&
        contains(
          fromJSON('["lgtm","approved","do-not-merge/hold"]'),
          github.event.label.name
        )) ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'do-not-merge/hold')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup validation scripts
        uses: ./.github/actions/setup-gh-scripts
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Verify label author matches slash-command trust
        working-directory: .github/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          SENDER: ${{ github.event.sender.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: npx tsx src/validation/verify-merge-pool-labels/index.ts

  retest-if-eligible:
    name: Retest if Newly Pool-Eligible and Stale
    needs: verify
    if: |
      always() &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped') &&
      (
        (github.event.action == 'labeled' && (github.event.label.name == 'lgtm' || github.event.label.name == 'approved')) ||
        (github.event.action == 'unlabeled' && (
          github.event.label.name == 'hold' ||
          github.event.label.name == 'needs-rebase' ||
          startsWith(github.event.label.name, 'do-not-merge/')
        ))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup scripts
        uses: ./.github/actions/setup-gh-scripts
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Dispatch retest if now pool-eligible and check is stale
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        working-directory: .github/scripts
        run: npx tsx src/merge/pool-entry.ts
