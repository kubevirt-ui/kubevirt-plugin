name: PR Label Sync

# Consolidated from verify-merge-pool-labels.yml + retest-on-pool-entry.yml.
#
# A single job handles routing based on the label event. This avoids
# multiple "Skipped" entries in the PR checks UI -- the job exits
# cleanly when no action is needed.
#
# Sequential ordering: verify label legitimacy *before* acting on pool state.
on:
  pull_request_target:
    types: [labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.label.name }}-${{ github.event.action }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  actions: write

jobs:
  handle-label:
    name: Handle Label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate label event
        id: eval
        env:
          LABEL: ${{ github.event.label.name }}
          ACTION: ${{ github.event.action }}
        run: |
          NEEDS_VERIFY="false"
          NEEDS_RETEST="false"

          VERIFY_LABELS='["lgtm","approved","do-not-merge/hold"]'

          if [[ "$ACTION" == "labeled" ]]; then
            if echo "$VERIFY_LABELS" | jq -e --arg l "$LABEL" 'map(select(. == $l)) | length > 0' > /dev/null 2>&1; then
              NEEDS_VERIFY="true"
            fi
            if [[ "$LABEL" == "lgtm" || "$LABEL" == "approved" ]]; then
              NEEDS_RETEST="true"
            fi
          elif [[ "$ACTION" == "unlabeled" ]]; then
            if [[ "$LABEL" == "do-not-merge/hold" ]]; then
              NEEDS_VERIFY="true"
              NEEDS_RETEST="true"
            elif [[ "$LABEL" == "hold" || "$LABEL" == "needs-rebase" || "$LABEL" == do-not-merge/* ]]; then
              NEEDS_RETEST="true"
            fi
          fi

          echo "needs_verify=$NEEDS_VERIFY" >> "$GITHUB_OUTPUT"
          echo "needs_retest=$NEEDS_RETEST" >> "$GITHUB_OUTPUT"

          if [[ "$NEEDS_VERIFY" == "false" && "$NEEDS_RETEST" == "false" ]]; then
            echo "No action needed for $ACTION of '$LABEL'"
          fi

      - name: Checkout
        if: steps.eval.outputs.needs_verify == 'true' || steps.eval.outputs.needs_retest == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup scripts
        if: steps.eval.outputs.needs_verify == 'true' || steps.eval.outputs.needs_retest == 'true'
        uses: ./.github/actions/setup-gh-scripts
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Verify label author matches slash-command trust
        if: steps.eval.outputs.needs_verify == 'true'
        working-directory: .github/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          SENDER: ${{ github.event.sender.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: npx tsx src/validation/verify-merge-pool-labels/index.ts

      - name: Dispatch retest if now pool-eligible and check is stale
        if: steps.eval.outputs.needs_retest == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        working-directory: .github/scripts
        run: npx tsx src/merge/pool-entry.ts
