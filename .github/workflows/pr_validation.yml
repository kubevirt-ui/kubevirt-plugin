name: PR Validation

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-validation:
    name: PR Validation
    permissions:
      pull-requests: write
      issues: write
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Check applicability
        id: check
        if: github.event.action == 'edited' && github.event.changes.title == null
        run: |
          echo "Body-only edit -- title unchanged, nothing to re-validate."
          echo "skip=true" >> "$GITHUB_OUTPUT"

      # Pin to default branch: pull_request_target checks out the PR base,
      # which may lack setup-gh-scripts on older release branches.
      - name: Checkout
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup validation scripts
        if: steps.check.outputs.skip != 'true'
        uses: ./.github/actions/setup-gh-scripts
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Run PR validation
        if: steps.check.outputs.skip != 'true'
        working-directory: .github/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: npx tsx src/validation/pr-validation/index.ts
