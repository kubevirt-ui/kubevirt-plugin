name: On Base Branch Push

# When main or a release-* branch advances, for open PRs targeting that same
# base only:
#   1. Mark gating checks stale + retest merge-pool PRs (tide-equivalent).
#   2. Re-check mergeability and sync the needs-rebase label.
#
# Per-base isolation: a push to release-4.23 never touches release-4.22 or main
# PRs (BASE_REF = github.ref_name).
#
# First checkout is always default_branch so local composite actions resolve on
# older release tips that do not ship .github/actions/.
on:
  push:
    branches: [main, 'release-*']

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  actions: write

jobs:
  list-open-prs:
    name: List Open PRs Targeting ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      pool_pr_numbers: ${{ steps.list.outputs.pool_pr_numbers }}
      all_pr_numbers: ${{ steps.list.outputs.all_pr_numbers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup scripts
        uses: ./.github/actions/setup-gh-scripts
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: List open PRs and classify merge-pool membership
        id: list
        env:
          BASE_REF: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: .github/scripts
        run: npx tsx src/merge/stale-gating.ts

  # ── Stale gating ────────────────────────────────────────────
  # One matrix job per PR so publish-gating-check runs as a normal step
  # and one PR's failure (e.g. a deleted fork branch) stays isolated.
  mark-stale:
    name: Mark Stale (PR #${{ matrix.pr_number }})
    needs: list-open-prs
    if: needs.list-open-prs.outputs.all_pr_numbers != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr_number: ${{ fromJson(needs.list-open-prs.outputs.all_pr_numbers) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup scripts
        uses: ./.github/actions/setup-gh-scripts
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Determine whether to (re-)mark this PR stale
        id: check
        env:
          BASE_REF: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr_number }}
          POOL_PR_NUMBERS: ${{ needs.list-open-prs.outputs.pool_pr_numbers }}
        working-directory: .github/scripts
        run: npx tsx src/merge/stale-mark-check.ts

      - name: Generate bot token
        id: bot-token
        if: always()
        uses: ./.github/actions/create-bot-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          # Needed so the next step's publish-gating-check can create/update the
          # "Run Gating Tests" check-run. create-bot-token omits checks by
          # default, which made Mark check stale 403 (and the clear below then
          # stripped e2e-passed while the check stayed success).
          permission-checks: write

      - name: Mark check stale
        id: mark-stale
        if: steps.check.outputs.should_mark == 'true'
        uses: ./.github/actions/publish-gating-check
        with:
          head-sha: ${{ steps.check.outputs.head_sha }}
          status: completed
          conclusion: neutral
          title: 'Hot Cluster E2E: stale -- ${{ github.ref_name }} has advanced since this ran'
          summary: ${{ steps.check.outputs.summary }}
          github-token: ${{ steps.bot-token.outputs.token }}

      - name: Clear stale e2e-passed/e2e-failed
        # Clear the labels ONLY when the stale marker was actually published
        # (the Mark check stale step succeeded). Previously this ran with
        # if: always(), so when marking the check stale failed, the e2e-passed
        # label was still removed -- leaving the PR with a success "Run Gating
        # Tests" check but no e2e-passed label (passed, yet unlabeled). Coupling
        # the clear to the marker keeps label and check consistent: both flip to
        # stale together, or neither does (the job still fails, so the next base
        # push retries). A passing retest re-adds the label.
        if: steps.mark-stale.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/clear-e2e-result-labels
        with:
          pr-number: ${{ matrix.pr_number }}
          github-token: ${{ steps.bot-token.outputs.token || github.token }}

  # Real retest, merge-pool PRs only. Dispatches fresh (pr_number path,
  # against the PR base) rather than reRunWorkflow, which would reuse the
  # cached head SHA and silently re-test the same commit instead of the new
  # base tip.
  #
  # needs: mark-stale so every stale marker lands before any retest, or a
  # delayed marker could mask a fast retest's result. if: always() keeps one
  # PR's stale-marking failure from blocking the rest, so list-open-prs'
  # result is checked explicitly instead of relying on implicit success().
  retest-pool-prs:
    name: Retest Merge-Pool PRs (PR #${{ matrix.pr_number }})
    needs: [list-open-prs, mark-stale]
    if: |
      always() &&
      needs.list-open-prs.result == 'success' &&
      needs.list-open-prs.outputs.pool_pr_numbers != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr_number: ${{ fromJson(needs.list-open-prs.outputs.pool_pr_numbers) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup scripts
        uses: ./.github/actions/setup-gh-scripts
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Dispatch hot-cluster-e2e.yml retest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr_number }}
        working-directory: .github/scripts
        run: npx tsx src/merge/stale-dispatch.ts

  # ── Needs-rebase sync ───────────────────────────────────────
  # Base advancing can introduce conflicts that a PR's own events can't
  # detect. Re-checks every open PR's mergeability and syncs the label.
  sync-rebase-label:
    name: Sync Needs-Rebase Label (PR #${{ matrix.pr_number }})
    needs: list-open-prs
    if: needs.list-open-prs.outputs.all_pr_numbers != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr_number: ${{ fromJson(needs.list-open-prs.outputs.all_pr_numbers) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: needs-rebase-${{ matrix.pr_number }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Generate bot token
        id: bot-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-issues: write

      - name: Setup scripts
        uses: ./.github/actions/setup-gh-scripts
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Sync label from mergeable state
        env:
          BOT_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr_number }}
        working-directory: .github/scripts
        run: npx tsx src/merge/needs-rebase-entry.ts
