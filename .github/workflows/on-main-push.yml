name: On Main Push

# Consolidated from retest-stale-gating.yml + needs-rebase-on-push.yml.
#
# When main advances, two things need to happen for every open PR:
#   1. Mark gating checks stale + retest merge-pool PRs (tide-equivalent).
#   2. Re-check mergeability and sync the needs-rebase label.
#
# Both used the same list→matrix fan-out pattern. This workflow shares a
# single list job, saving one runner and one API paginate call per push.
on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  actions: write

jobs:
  list-open-prs:
    name: List Open PRs Targeting main
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      pool_pr_numbers: ${{ steps.list.outputs.pool_pr_numbers }}
      all_pr_numbers: ${{ steps.list.outputs.all_pr_numbers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup scripts
        uses: ./.github/actions/setup-gh-scripts
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: List open PRs and classify merge-pool membership
        id: list
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: .github/scripts
        run: npx tsx src/merge/stale-gating.ts

  # ── Stale gating ────────────────────────────────────────────
  # One matrix job per PR so publish-gating-check runs as a normal step
  # and one PR's failure (e.g. a deleted fork branch) stays isolated.
  mark-stale:
    name: Mark Stale (PR #${{ matrix.pr_number }})
    needs: list-open-prs
    if: needs.list-open-prs.outputs.all_pr_numbers != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr_number: ${{ fromJson(needs.list-open-prs.outputs.all_pr_numbers) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup scripts
        uses: ./.github/actions/setup-gh-scripts
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Determine whether to (re-)mark this PR stale
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr_number }}
          POOL_PR_NUMBERS: ${{ needs.list-open-prs.outputs.pool_pr_numbers }}
        working-directory: .github/scripts
        run: npx tsx src/merge/stale-mark-check.ts

      - name: Generate bot token
        id: bot-token
        if: always()
        uses: ./.github/actions/create-bot-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Mark check stale
        if: steps.check.outputs.should_mark == 'true'
        uses: ./.github/actions/publish-gating-check
        with:
          head-sha: ${{ steps.check.outputs.head_sha }}
          status: completed
          conclusion: neutral
          title: 'Hot Cluster E2E: stale -- main has advanced since this ran'
          summary: ${{ steps.check.outputs.summary }}
          github-token: ${{ steps.bot-token.outputs.token }}

      - name: Clear stale e2e-passed/e2e-failed
        if: always()
        continue-on-error: true
        uses: ./.github/actions/clear-e2e-result-labels
        with:
          pr-number: ${{ matrix.pr_number }}
          github-token: ${{ steps.bot-token.outputs.token || github.token }}

  # Real retest, merge-pool PRs only. Dispatches fresh (pr_number path,
  # against main) rather than reRunWorkflow, which would reuse the cached
  # head SHA and silently re-test the same commit instead of the new base tip.
  #
  # needs: mark-stale so every stale marker lands before any retest, or a
  # delayed marker could mask a fast retest's result. if: always() keeps one
  # PR's stale-marking failure from blocking the rest, so list-open-prs'
  # result is checked explicitly instead of relying on implicit success().
  retest-pool-prs:
    name: Retest Merge-Pool PRs (PR #${{ matrix.pr_number }})
    needs: [list-open-prs, mark-stale]
    if: |
      always() &&
      needs.list-open-prs.result == 'success' &&
      needs.list-open-prs.outputs.pool_pr_numbers != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr_number: ${{ fromJson(needs.list-open-prs.outputs.pool_pr_numbers) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Setup scripts
        uses: ./.github/actions/setup-gh-scripts
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Dispatch hot-cluster-e2e.yml retest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr_number }}
        working-directory: .github/scripts
        run: npx tsx src/merge/stale-dispatch.ts

  # ── Needs-rebase sync ───────────────────────────────────────
  # main advancing can introduce conflicts that a PR's own events can't
  # detect. Re-checks every open PR's mergeability and syncs the label.
  sync-rebase-label:
    name: Sync Needs-Rebase Label (PR #${{ matrix.pr_number }})
    needs: list-open-prs
    if: needs.list-open-prs.outputs.all_pr_numbers != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr_number: ${{ fromJson(needs.list-open-prs.outputs.all_pr_numbers) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: needs-rebase-${{ matrix.pr_number }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate bot token
        id: bot-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-issues: write

      - name: Setup scripts
        uses: ./.github/actions/setup-gh-scripts
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Sync label from mergeable state
        env:
          BOT_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr_number }}
        working-directory: .github/scripts
        run: npx tsx src/merge/needs-rebase-entry.ts
