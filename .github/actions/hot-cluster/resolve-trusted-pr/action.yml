name: Resolve Trusted PR
description: >
  Resolve a PR's head SHA/repo and verify the workflow triggerer is listed
  in OWNERS before any in-cluster build touches PR code. Shared by every
  manual-console workflow that builds + runs arbitrary PR source on a
  self-hosted runner, so this security-sensitive check can't drift between
  callers. Trusts GITHUB_ACTOR (UI dispatch) or triggered-by when a bot
  dispatches after the PR command dispatcher already gated the commenter.
  On re-runs, trusts GITHUB_TRIGGERING_ACTOR only (never the original
  TRIGGERED_BY / GITHUB_ACTOR).

inputs:
  pr-number:
    description: PR number to resolve and check
    required: true
  github-token:
    description: Token for the GitHub API call
    required: true
  triggered-by:
    description: >
      Login of the human who authorized the run (e.g. PR comment author).
      Required when a bot dispatches this workflow; ignored for human
      workflow_dispatch (GITHUB_ACTOR is checked instead).
    required: false
    default: ''

outputs:
  head-sha:
    description: PR head commit SHA
    value: ${{ steps.resolve.outputs.head_sha }}
  head-repo:
    description: >
      PR head repository full_name, or the literal string
      "(source repository deleted)" if the fork no longer exists
    value: ${{ steps.resolve.outputs.head_repo }}

runs:
  using: composite
  steps:
    - name: Checkout default branch
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.repository.default_branch }}
        persist-credentials: false

    - name: Setup scripts
      uses: ./.github/actions/setup-gh-scripts
      with:
        ref: ${{ github.event.repository.default_branch }}

    - name: Resolve PR and verify triggerer is a trusted repo owner
      id: resolve
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        TRIGGERED_BY: ${{ inputs.triggered-by }}
      working-directory: .github/scripts
      run: npx tsx src/e2e/resolve-trusted-pr.ts
