name: Release CI Test Environment
description: >
  Signal the ci-env-controller to tear down a test environment by patching
  the trigger ConfigMap to desired-state=absent, then wait for cleanup to
  complete and delete the ConfigMap.

inputs:
  configmap-name:
    description: Name of the trigger ConfigMap
    required: true
  ci-env-namespace:
    description: Namespace where ci-env-controller runs
    default: ci-env
  timeout:
    description: Max seconds to wait for cleanup to complete
    default: '300'

runs:
  using: composite
  # The infra scripts are served from the .hc-infra overlay (checked out from
  # main by the calling job), not the product checkout -- a release branch's
  # product tree has no ci-scripts/hot-cluster/ts. This action is only invoked
  # by hot-cluster-e2e-run.yml's run-gating-tests job, which creates that
  # overlay before calling here.
  steps:
    - name: Release environment
      shell: bash
      env:
        CM_NAME: ${{ inputs.configmap-name }}
        CM_NS: ${{ inputs.ci-env-namespace }}
        TIMEOUT: ${{ inputs.timeout }}
      working-directory: .hc-infra/ci-scripts/hot-cluster/ts
      run: npx tsx src/scripts/ci-env-release.ts
