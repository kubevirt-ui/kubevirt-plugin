name: Request CI Test Environment
description: >
  Create a trigger ConfigMap for the ci-env-controller and wait until the
  test environment (namespace, console, plugin) is provisioned and ready.

inputs:
  plugin-image:
    description: Plugin container image to deploy
    required: true
  test-namespace:
    description: Kubernetes namespace for the test environment
    required: true
  configmap-name:
    description: Name of the trigger ConfigMap
    required: true
  ci-env-namespace:
    description: Namespace where ci-env-controller runs
    default: ci-env
  timeout:
    description: Max seconds to wait for environment to become ready
    default: '360'
  user-settings-location:
    description: |
      Optional override for the console's BRIDGE_USER_SETTINGS_LOCATION
      ("configmap" or "localstorage"). Leave empty (default) to keep the
      ci-test-stack chart's own default (localstorage).
    required: false
    default: ''
  console-image:
    description: |
      Optional override for the console container image. Leave empty (default)
      to let ci-env-request.ts pick its default (origin-console:5.0). A release
      branch run passes the matching console (e.g. origin-console:4.21) so the
      product is tested against the console it actually ships with.
    required: false
    default: ''

outputs:
  bridge-base-address:
    description: In-cluster URL for the console bridge
    value: ${{ steps.request.outputs.bridge-base-address }}
  console-route:
    description: External HTTPS route for the console
    value: ${{ steps.request.outputs.console-route }}

runs:
  using: composite
  # The infra scripts are served from the .hc-infra overlay (checked out from
  # main by the calling job), not the product checkout -- a release branch's
  # product tree has no ci-scripts/hot-cluster/ts. This action is only invoked
  # by hot-cluster-e2e-run.yml's run-gating-tests job, which creates that
  # overlay (and installs its deps) before calling here.
  steps:
    - name: Install infra script dependencies
      shell: bash
      working-directory: .hc-infra/ci-scripts/hot-cluster/ts
      run: npm ci --ignore-scripts --no-audit

    - name: Request and wait for test environment
      id: request
      shell: bash
      env:
        CM_NAME: ${{ inputs.configmap-name }}
        CM_NS: ${{ inputs.ci-env-namespace }}
        CONSOLE_IMAGE: ${{ inputs.console-image }}
        PLUGIN_IMAGE: ${{ inputs.plugin-image }}
        TEST_NS: ${{ inputs.test-namespace }}
        TIMEOUT: ${{ inputs.timeout }}
        USER_SETTINGS_LOCATION: ${{ inputs.user-settings-location }}
      working-directory: .hc-infra/ci-scripts/hot-cluster/ts
      run: npx tsx src/scripts/ci-env-request.ts
