name: Request CI Test Environment
description: >
  Create a trigger ConfigMap for the ci-env-controller and wait until the
  test environment (namespace, console, plugin) is provisioned and ready.

inputs:
  plugin-image:
    description: Plugin container image to deploy
    required: true
  test-namespace:
    description: Kubernetes namespace for the test environment
    required: true
  configmap-name:
    description: Name of the trigger ConfigMap
    required: true
  ci-env-namespace:
    description: Namespace where ci-env-controller runs
    default: ci-env
  timeout:
    description: Max seconds to wait for environment to become ready
    default: '360'
  user-settings-location:
    description: |
      Optional override for the console's BRIDGE_USER_SETTINGS_LOCATION
      ("configmap" or "localstorage"). Leave empty (default) to keep the
      ci-test-stack chart's own default (localstorage).
    required: false
    default: ''

outputs:
  bridge-base-address:
    description: In-cluster URL for the console bridge
    value: ${{ steps.request.outputs.bridge-base-address }}
  console-route:
    description: External HTTPS route for the console
    value: ${{ steps.request.outputs.console-route }}

runs:
  using: composite
  steps:
    - name: Request and wait for test environment
      id: request
      shell: bash
      env:
        CM_NAME: ${{ inputs.configmap-name }}
        CM_NS: ${{ inputs.ci-env-namespace }}
        PLUGIN_IMAGE: ${{ inputs.plugin-image }}
        TEST_NS: ${{ inputs.test-namespace }}
        TIMEOUT: ${{ inputs.timeout }}
        USER_SETTINGS_LOCATION: ${{ inputs.user-settings-location }}
      working-directory: ci-scripts/hot-cluster/ts
      run: npx tsx src/scripts/ci-env-request.ts
