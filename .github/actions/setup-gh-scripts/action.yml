name: Setup GitHub Scripts
description: Checkout PR validation scripts and install npm dependencies

inputs:
  ref:
    description: Git ref to checkout scripts from (typically the PR base branch)
    required: true

runs:
  using: composite
  steps:
    - name: Checkout scripts
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}
        sparse-checkout: |
          .github/scripts
          .github/actions
          ci-scripts/hot-cluster/js
          ci-scripts/hot-cluster/ts
        persist-credentials: false
        # clean: false so this second checkout doesn't git-clean the workspace
        # and wipe node_modules an earlier step already installed (e.g. the
        # `npm ci` in ci-scripts/hot-cluster/ts in the teardown / auto-teardown
        # jobs, whose later tsx steps would then fail "Cannot find module").
        # Safe: every caller runs on a fresh GitHub-hosted runner, so there are
        # no stale tracked files to clean on the first checkout.
        clean: false

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: .github/scripts/package-lock.json

    - name: Install script dependencies
      shell: bash
      working-directory: .github/scripts
      run: npm ci
